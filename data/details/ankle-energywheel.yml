# 프로젝트 상세 내용 (이전 구글 사이트에서 옮김)
title: "에너지휠 기반 발목보조로봇 개발"
source: "https://sites.google.com/view/kim-minjae/iirl-projects/iirl-main-project/%EC%97%90%EB%84%88%EC%A7%80%ED%9C%A0-%EA%B8%B0%EB%B0%98-%EB%B0%9C%EB%AA%A9%EB%B3%B4%EC%A1%B0%EB%A1%9C%EB%B4%87-%EA%B0%9C%EB%B0%9C"
blocks:
  - { type: h, text: "연구과제의 최종 목표" }
  - { type: p, text: "관절제한 구조를 활용하여 자세를 지지하고, 반작용 휠(reaction wheel)을 이용하여 push-off를 보조하는 발목 보조용 보행보조장치 개발" }
  - { type: li, level: 1, text: "8 Nm 보조 (보행 시 80 kg 성인의 발목 토크의 10 %)" }
  - { type: h, text: "연구과제의 필요성" }
  - { type: li, level: 1, text: "관절보조 방식의 문제점 : 착용부를 통한 동력 전달의 한계" }
  - { type: li, level: 2, text: "관절을 중심으로 토크를 보조하는 방식은 보조 대상 관절과 구동축이 일치한다고 가정. 그 결과 보조가 직관적이고 제작이 용이하여 현재 대부분 이 방식을 채택." }
  - { type: li, level: 2, text: "실제로 착용자 관절축과 장치의 관절출을 직접 연결할 수 없으므로 착용부를 통해 간접적으로 일치 유도. 그 결과 축 불일치(--> 보조력 전달 손실), 착용부에 과도한 힘이 집중 (--> 착용자 불편/고통 호소) 등 발생. 또한 2자유도 복합 관절인 발목을 1자유도 하네스로 강하게 구속하기 때문에 불편함 야기" }
  - { type: img, src: images/details/ankle-energywheel/01.jpg, caption: "<착용부 체결이 불완전할 경우>" }
  - { type: h, text: "검증하고자 했던 가설" }
  - { type: li, level: 1, text: "관성력을 이용한 발목보조 방식 제안" }
  - { type: li, level: 2, text: "반작용 휠(reaction wheel)을 활용하여 관성력으로 push-off 보조할 수 있음" }
  - { type: h4, text: "Positive" }
  - { type: li, level: 3, text: "관성계를 지지점으로 삼으므로 정강이 착용부에 압박이 없음." }
  - { type: li, level: 3, text: "저출력 모터로도 고출력이 가능함." }
  - { type: h4, text: "Negative" }
  - { type: li, level: 3, text: "무게 대비 보조력이 충분할지 검증이 필요함." }
  - { type: li, level: 3, text: "별도의 자세지지 수단이 필요함." }
  - { type: li, level: 2, text: "일반적으로 반작용 휠을 통해 출력할 수 있는 토크는 작음. 출력을 키우기 위해서는 모터 출력을 높이거나 휠의 관성모멘트를 키워야 하며, 이는 모두 무게 증가를 야기." }
  - { type: li, level: 2, text: "저출력 모터를 사용하여 휠을 가속하여 고속 회전을 만든 후 제동장치로 순간적으로 급감속시킴으로써 고토크를 순간적으로 출력하거나 jump-up 모션 구현에 활용 가능." }
  - { type: li, level: 1, text: "Push-Off 보조를 위해서 발 착용부에 반작용 휠을 설치할 경우, 발착용부에 대해서만 작용할 수 있기 때문에 정강이 위치에 대해서는 영향을 줄 수 없음. 따라서 자세 지지는 관절제한 장치를 추가하여 대응" }
  - { type: img, src: images/details/ankle-energywheel/02.jpg, caption: "<반작용 휠 활용 예 / 관성력 기반 보조방치 개념도>" }
  - { type: h, text: "연구과제의 수행 과정 및 수행 내용" }
  - { type: li, level: 1, text: "반작용 휠 기반 구동모듈 테스트베드 제작 : 성능 검증을 위한 테스트베드를 제작하여 출력토크에 대한 모델 수립" }
  - { type: li, level: 2, text: "반작용 휠을 모터로 가속하여 에너지를 저장하고, 저장된 에너지로 Jump-up 할 수 있도록 실험장치를 구성" }
  - { type: li, level: 2, text: "정상보행 시 push-off(preswing)은 50~60% 구간으로, 일반적으로 한 gait cycle 당 평균 1초 정도 걸린다고하면 push-off는 0.1초 정도 걸림. 따라서 반작용 휠도 0.1초 이내에 정지할 수 있어야 함." }
  - { type: li, level: 2, text: "짧은 시간 내에 확실한 제동력을 보이기 위해, 라쳇(ratchet) 구조를 활용하여 반작용 휠 구동모듈을 개발함" }
  - { type: li, level: 2, text: "주요 프레임은 3D프린터로 제작하였으며, 에너지 저장용량 증가를 위해 여분의 금속 무게추를 휠에 장착: (light) 50g 무게추 3개 장착 / (heavy) 50g 무게추 3개 + 100g 무게추 3개 장착" }
  - { type: li, level: 2, text: "반작용 휠을 0.2Nm의 일정한 토크로 가속하고, 속도제한으로 설정한 속도에 도달하면 폴 암을 닫아서 제동하는 식으로 장치를 동작시킴. 이때 진자 형태의 실험장치가 올라가는 각도로 걸리는 발생하는 토크의 크기를 측정함" }
  - { type: img, src: images/details/ankle-energywheel/03.jpg, caption: "<반작용 휠 구동모듈 테스트베드 구성>" }
  - { type: li, level: 1, text: "저출력 모터를 사용하여 휠을 가속한 후 급제동 시 관성력으로 인해 발생하는 토크 관찰. 입력 속도가 변하는 상황에서도 제동 시 반작용 휠은 0.02~0.03sec (<0.1sec) 안에 멈추는 것을 실험적으로 확인함. 따라서 개발한 구동모듈은 push-off 보조에 활용 가능함 (1/3 정도 시간 안에 보조 완료)" }
  - { type: img, src: images/details/ankle-energywheel/04.jpg, caption: "<다양한 모터 속도에 대한 반작용 휠의 제동 성능>" }
  - { type: li, level: 1, text: "제동 시 발생하는 각속도, 제동으로 발생하는 최대 토크, 진자의 최대 높이를 계산하기 위해 반작용 휠 구동 모듈에 대한 모델링을 수립함. 중간 손실을 무시하고, 제동 시 발생하는 토크 패턴을 2차 다항식 형태로 가정하면 운동량 보존 법칙 및 에너지 보존 법칙을 활용하여 계산 가능함. 단 이 경우 반작용 휠의 관성모멘트, 진자의 관성모멘트, 전체 질량 및 그로 인한 무게중심의 거리 정보가 필요함. 3D CAD를 통해서 근사치를 계산할 수 있으나 정확한 값을 알 수는 없음. 이를 해결하기 위해 비선형 최적화를 적용함. 모델의 비선형 수식을 기반으로 입력인 제동 직전의 모터 속도와 출력인 진자가 올라간 최대 각도를 고려하여 비선형 수식을 정리하고 least squares curve fitting(lsqcurvefit @Matlab)을 적용하여 각 변수의 최적화를 수행함. 최적화를 통해 구한 파라미터를 활용하여 구동 모듈의 성능을 평가함" }
  - { type: li, level: 1, text: "발생하는 토크는 제동 시 운동량 변화에 비례하며, 정지까지 걸리는 시간에 반비례함. 따라서 모터의 관성모멘크가 크거나, 모터의 속도가 빠를 경우 발생하는 최대 토크가 증가함. 실험을 통해 1) 속도가 증가할수록 발생하는 최대 토크가 증가함, 2) 같은 속도라도 관성 모멘트가 클 경우 더 큰 토크를 발생시키는 것을 확인함. 제동 시간의 경우 0.02~0.03sec 정도 걸리는데, 같은 속도/관성모멘트라고 해도 제동시간이 늦어질 경우 발생하는 최대 토크의 크기가 달라졌음. 현재 시스템에서 대략 200(중량)~450(경량)rad/sec 이상일 경우 최대토크가 8Nm 이상 발생하는 것을 실험적으로 검증함. 이 토크는 기존 감속기 기반으로 저속에서 토크를 증폭하는 경우와 달리 고속 운동 중에도 발생할 수 있으므로 보행 중 발목의 push-off와 같은 빠른 움직임 중에 순간 고토크가 필요한 경우 충분히 적용 가능함" }
  - { type: img, src: images/details/ankle-energywheel/05.jpg, caption: "<반작용휠 구동모듈의 수학적 모델링>" }
  - { type: img, src: images/details/ankle-energywheel/06.jpg, caption: "<최적화로 구한 동적 파라미터>" }
  - { type: img, src: images/details/ankle-energywheel/07.jpg, caption: "<제동 중 발생한 최대 토크(각 구간별 3회 측정 후 평균 값)>" }
  - { type: h, text: "반작용 휠 기반 보행보조장치 제작 및 테스트" }
  - { type: li, level: 1, text: "반작용 휠 구동모듈로 구동하는 보행보조장치를 제작하여 실제 보행 시 효과에 대해서 검증을 시도. 발목에 장착을 위한 착용부 및 기구 프레임을 제작하여 반작용 휠 기반 구동모듈을 장착하여 착용 로봇을 구성함" }
  - { type: li, level: 1, text: "단 제작된 로봇은 소형화가 진행되지 않아 크기가 크고, 전체 무게가 1.9kg에 육박하여 보행 테스트에 적합하지 않음. 그로 인해 보행 테스트 대신 지면발력기(Force Plate, FP4060-08-TM-2000 @bertec) 위에서 구동 시 push-off에서 보조하는 힘의 크기를 측정하는 수준에서 성능 검증을 진행함" }
  - { type: img, src: images/details/ankle-energywheel/08.jpg, caption: "<개발된 보행보조 장치 : 외형 및 무게>" }
  - { type: li, level: 1, text: "실험은 지면반력기 위에서 장치를 구동하는 방식으로 진행함. 장치를 착용한 상태에서 착용자가 힘 플레이트 위에서 런지 자세를 취함(push-off 상황 모사). 그 후 장치를 구동한 후 제동 시 발생하는 지면반발력 (Ground Reaction Force(GRF), Fz)을 측정하여 성능을 검증함. 3명의 건강한 남성 피험자(평균 신장 174.67 ± 6.86 cm, 체중 82.00 ± 14.28 kg, 연령 29.67 ± 12.42세)를 대상으로 반작용 휠이 138rad/sec(22rps)로 구동하는 상황에서 데이터를 수집함" }
  - { type: li, level: 1, text: "측정 결과 모든 실험에서 100N(10kgf) 이상의 보조력이 추가로 발생하는 것을 확인할 수 있었음. 이는 82kg 성인 대상으로 12.2% 이상의 체중 부하를 보조한 것과 같은 효과임. 피실험자1에 대하여 전진방향으로 발생하는 지면반발 모멘트(Mx)를 살펴봐도 평균 13.24Nm의 모멘트가 발생하고 있어 목표로 했던 수치인 8Nm 급의 보조를 장치를 통해 전달할 수 있음을 실험적으로 확인할 수 있었음." }
  - { type: img, src: images/details/ankle-energywheel/09.jpg, caption: "<지면반력기 기반 보행보조 성능 측정실험 세팅>" }
  - { type: img, src: images/details/ankle-energywheel/10.jpg, caption: "<보행보조장치 성능측정 실험 결과>" }
