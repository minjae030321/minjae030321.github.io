  - { type: p, text: "수행결과" }
  - { type: li, level: 1, text: "초기 위치에서 1번 위치 이동 후 방점 찍고 2~4번 위치를 경유한 후 다시 1번에 방점을 찍는 과정을 작업자의 개입없이 로봇 매니퓰레이터 스스로 수행하는 것을 실험적으로 확인함." }
  - { type: li, level: 1, text: "전체 수행 시간은 1분 10초 정도 소요되며, 1 cycle을 도는데 4초 내외로 걸림." }
  - { type: li, level: 1, text: "정밀도는 앞서와 마찬가지로 2mm 정도의 위치 오차가 있는 듯이 보이나 후퇴 시 처짐으로 인한 것으로, 정확한 위치에 방점을 찍는 것을 실험적으로 확인" }
  - { type: h, text: "기능구현상의 이슈" }
  - { type: li, level: 1, text: "방향(orientatin) 재확인" }
  - { type: li, level: 2, text: "FR20의 상태 및 조그 조작은 회사에서 제공하는 Web App에서 간단하게 수행할 수 있음. Web App을 보면 로봇의 각 관절각도 및 TCP(Tool-Center Point)의 위치 및 방향을 알 수 있음. 위치는 base frame을 기준으로 한 변위를 의미하지만 방향을 나타내는 “Rx,Ry,Rz” 가 무엇을 의미하는지 불분명함." }
  - { type: li, level: 2, text: "로봇공학에서 방향을 나타내는 방법은 오일러각도(euler angle), 롤-피치-요 각도(Roll- pitch- yaw angle), 단위 쿼터니안(Unit Quaterion), 동등 각도-축 표현 (equivalent angle-axis expression) 등 매우 다양한 방법이 존재함. 그러나 매뉴얼 상에는 이에 대한 특별한 설명이 없었음. 기체구조물의 방향에 따라서 드릴 작업을 위해서 TCP의 방향도 변경해줄 수 있어야 하며, 따라서 이 값들의 정체를 파악할 필요가 있었음" }
  - { type: img, src: images/details/drilling/15.jpg, caption: "그림 15. FR20의 Web App" }
  - { type: img, src: images/details/drilling/16.jpg, caption: "그림 16. FR20의 D-H parameter" }
  - { type: img, src: images/details/drilling/17.jpg, caption: "그림 17. FR20의 각 링크에서의 동차변환행렬 계산식" }
  - { type: img, src: images/details/drilling/18.jpg, caption: "그림 18. 동차변환행렬로 계산한 TCP의 위치 및 회전행렬" }
  - { type: li, level: 1, text: "Web App 상의 TCP 위치 정보를 확인하고, 그 값을 이용하여 회전행렬을 계산해주는 사이트(3D Rotation Converter)에서 회전행렬을 계산한 것과 비교해보았음." }
  - { type: li, level: 1, text: "Rx, Ry, Rz 정보를 Converter에 적용해본 결과 오일러 각도(ZYX)로 계산된 회전행렬이 D-H 파라미터를 바탕으로 python 코드로 계산한 회전행렬과 동일한 것을 볼 수 있었음. 따라서, FR20의 방향 표시를 위해서 오일러 각도(ZYX sequence)를 사용하고 있다는 것을 확인할 수 있었음." }
  - { type: img, src: images/details/drilling/19.jpg, caption: "그림 19. Web App 상의 TCP 좌표" }
  - { type: img, src: images/details/drilling/20.jpg, caption: "그림 20. 동차변환행렬로 계산한 TCP의 위치 및 회전행렬" }
  - { type: img, src: images/details/drilling/21.jpg, caption: "그림 21. TCP(Rx, Ry, Rx)를 오일러각도(ZYX)로 해석하고 표현" }
  - { type: li, level: 1, text: "실제로 오일러 각도를 이용하여 로봇 TCP의 방향을 원하는 데로 설정할 수 있는지 확인하기 위해서, 방향이 변하는 경로를 생성해 봄" }
  - { type: li, level: 1, text: "Matlab을 통해서 TCP 위치는 반원을 그리고, 동시에 X축을 기준으로 –135° 회전된 상태에서 X축을 진행 방향으로 방향이 틀어진 경로를 생성하였음." }
  - { type: li, level: 1, text: "원 위에 찍히는 위치는 7개로 설정하였고 각 위치에 대한 정보는 동차변환행렬에서 위치 벡터로 X,Y,Z 좌표를 구하고, 회전행렬로부터 오일러 각도(ZYX)을 역산해 Rx, Ry, Rz 값을 계산함. 이렇게 알게 된 TCP 위치/방향을 FR20에 넣어주면 Matlab에서 생성한 경로 그대로 이동하는 것을 확인할 수 있었음." }
  - { type: img, src: images/details/drilling/22.jpg, caption: "그림 22. Matlab으로 계산한 로봇 이동 경로 생성을 위한 Matlab 코드" }
  - { type: img, src: images/details/drilling/23.jpg, caption: "그림 23. Matlab으로 계산한 로봇의 이동경로:반지름이 5인 반원을 그림" }
