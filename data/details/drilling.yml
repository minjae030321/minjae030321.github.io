  - { type: li, level: 1, text: "목표 : 로봇 매니퓰레이터를 활용하여 작업대상물(혹은 기체구조물)의 지정된 5군데에서 드릴링을 7분(468초) 이하로 완료" }
  - { type: img, src: images/details/drilling/10.jpg, caption: "그림 10. 자동 드릴링 작업 모식도" }
  - { type: p, text: "그림 10 설명" }
  - { type: p, text: "1. 로봇 매니퓰레이터가 초기 위치(Home Position)에 위치함" }
  - { type: p, text: "2. 로봇 매니퓰레이터가 Workspace(작업공간) 내 드릴작업 정위치로부터 –100mm (작업 대기 위치), -40mm(입구 위치), -25mm (구멍 결합 위치), -5mm (드릴 작업 위치) 순으로 순차적으로 이동하면서 드릴을 서포트 지그 내 홀에 삽입함" }
  - { type: p, text: "3. R-EDU를 동작시켜 드릴 작업을 원격으로 수행" }
  - { type: p, text: "4. 1→3번 마지막 구멍에 도달할 때까지 작업 반복" }
  - { type: p, text: "5. 마지막 구멍의 드릴링이 끝난 후 초기 위치(Home Position)로 복귀함" }
  - { type: h, text: "수행 결과" }
  - { type: li, level: 1, text: "작업자의 개입없이 로봇팔 스스로 작업을 드릴링 작업을 수행하는 것을 실험적으로 확인함." }
  - { type: li, level: 1, text: "직접교시를 통해 획득한 좌표를 활용해서 로봇 매니퓰레이터가 정확한 드릴 위치를 잘 찾아가서 작업을 수행하는 것을 확인함" }
  - { type: li, level: 1, text: "서포트 지그를 통해 드릴이 정확한 작업 위치에 위치할 수 있으며, 가공 품질(quality)이 거의 동일한 것을 실험적으로 확인할 수 있음" }
  - { type: li, level: 1, text: "로봇이 2분 30초 내외로 작업을 수행하며, 이는 당초 목표인 홀 가공속도 468초 보다 훨씬 짧은 시간 내에 수행할 수 있었음. 자동화를 통해 작업시간 단축이 가능함을 실험적으로 확인할 수 있었음" }
