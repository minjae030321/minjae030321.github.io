  - { type: h, text: "고정밀 드릴링 자동화 실험 수행" }
  - { type: p, text: "1. 드릴링 위치 정보 획득" }
  - { type: li, level: 1, text: "시나리오" }
  - { type: li, level: 2, text: "기체구조물 시편은 일반적으로 테이블에 임의로 배치되어 있으므로 드릴링 작업 자동화를 위해서는 작업 위치(혹은 서포트 지그의 각 홀의 위치) 정보를 정확하게 알 수 있어야 함. 위치 정보를 획득하기 위해 직접교시(direct teaching)을 활용함." }
  - { type: li, level: 2, text: "전체적인 시나리오는 다음과 같음(그림 7 참고)." }
  - { type: li, level: 2, text: "Clmaping과 Unclamping을 2회 수행하는 이유는 직접교시 모드인 상태에서 Clamping/Unclamping 시 로봇 매니퓰레이터가 조금씩 중앙으로 맞추지기 때문임. 1회 수행했을 때보다 위치 데이터의 정확성이 높아지기 때문에 2회 수행함" }
  - { type: li, level: 2, text: "로봇 메니퓰레이터의 위치 데이터를 읽어와서 CSV파일로 자동으로 저장하기 위해서 프로그램을 작성함. 드릴링 자동화 과정에서 이 CSV 파일을 불러와 각 위치 데이터를 이용하여 작업 위치를 복원함" }
  - { type: li, level: 3, text: "자동 드릴 작업을 위한 드릴 위치 5개에 대한 정확한 위치정도를 CSV 파일일에 저장함" }
  - { type: img, src: images/details/drilling/06.jpg, caption: "그림 6. 직접교시로 로봇을 작업위치로 이송" }
  - { type: img, src: images/details/drilling/07.jpg, caption: "그림 7. 위치 데이터 저장 순서도" }
  - { type: img, src: images/details/drilling/08.jpg, caption: "그림 8. 로봇 매니퓰레이터의 위치데이터를 읽어서 CSV 파일로 저장하는 코드" }
  - { type: img, src: images/details/drilling/09.jpg, caption: "그림 9. 저장된 위치 데이터(5개의 지그 위치 저장)" }
