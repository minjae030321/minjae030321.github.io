  - { type: li, level: 2, text: "평가방법: 기체구조물 시편을 아래와 같이 서포터 지그를 활용하여 고정 후, 드릴링 작업용 홀을 기준으로 좌측 3군데, 우측 3군데 총 6군데에 대한 드릴링 작업을 자동으로 수행함. 1회 연속 수행" }
