  - { type: h, text: "F/T센서(RFT80-6A02) 시리얼 통신 설정방법" }
  - { type: li, level: 1, text: "F/T센서는 고속 통신이 가능한 etherCAT를 지원하는 타입이나, etherCAT을 통한 PC 통신을 구현하지 못해서 활용을 못 함. 주관 기관((주)라이브워크)에서 ESP32를 활용하여 etherCAT-to -serial 통신 모듈을 제작해 주었고, 그것을 통해 F/T 센서 값을 시리얼 통신으로 받아서 신호처리를 수행함" }
  - { type: li, level: 1, text: "통신 프로토콜을 참고하여 시리얼 데이터를 파싱하는 코드를 작성하여 F/T센서 데이터를 획득함" }
