  - { type: p, text: "수행결과" }
  - { type: li, level: 1, text: "초기 위치에서 1번 위치 이동 후 방점~4번 위치 이동 후 방점을 찍는 과정을 작업자의 개입 없이 로봇 매니퓰레이터 스스로 수행하는 것을 실험적으로 확인함." }
  - { type: li, level: 1, text: "전체 수행 시간은 2분 10초 정도 소요되며, 2mm 정도의 위치 오차가 있는 듯이 보임. 그러나 이건 로봇이 후퇴하는 과정에서 매니퓰레이터 끝단이 처지면서 발생하는 것으로, 로봇 매니퓰레이터가 점을 찍는 위치는 동일함. 따라서 목표 정밀도를 충족할 수 있음." }
