  - { type: li, level: 1, text: "PD 제어기 구성" }
  - { type: li, level: 1, text: "CST(Cyclic Synchronous Torque) 모드를 통해 모터 토크 제어" }
  - { type: h, text: "장치의 개발 배경 및 동기" }
  - { type: li, level: 1, text: "일반적인 트레드밀은 사용자가 미리 설정한 속도로 동작하며, 사용자가 해당 속도를 따라가야 하는 구조임." }
  - { type: li, level: 1, text: "본 프로젝트는 보조로봇의 성능을 테스트하기 위한 기반 장치로 트레드밀이 필요하여 파생되었음." }
  - { type: li, level: 1, text: "초기 실험에서는 사용자가 일정 거리를 이동하는 데 걸리는 시간을 측정하여 선호 속도를 간접적으로 계산함." }
  - { type: li, level: 1, text: "그러나 이 방식은 실제 사용자의 선호 속도를 반영한다고 보기 어려우며, 실시간 반응성이 부족함." }
  - { type: li, level: 1, text: "이에 따라, 사용자의 위치 오차(error)를 실시간으로 인식하여 자동으로 속도를 조절하는 트레드밀 개발을 목표로 함." }
  - { type: h, text: "장치 설명" }
  - { type: li, level: 1, text: "realsense 카메라를 사용해 사람의 포즈를 판단한다. 포즈에서 특정 위치를 판단하여 거리 데이터를 받아옴." }
  - { type: img, src: images/details/treadmill/04.jpg, caption: "그림 3. 사람의 포즈 인식과 거리 데이터 출력" }
  - { type: img, src: images/details/treadmill/05.jpg, caption: "그림 4. 거리 데이터 그래프로 출력" }
  - { type: li, level: 1, text: "거리 데이터를 gRPC 통신을 통해 Jetson Xavier NX 보드에서 라즈베리 파이로 거리 데이터를 전송." }
  - { type: video, id: "15-9ujLkgH49Z5xtpm_5b0FC37nVffoxI" }
  - { type: p, text: "Jetson Xavier NX : gRPC Server (Python)" }
  - { type: video, id: "1LlVDi_OdlQS3QqJGShAyPAIPuuwEXovK" }
  - { type: p, text: "Raspberry Pi 4 : gRPC Client (C++)" }
  - { type: li, level: 1, text: "라즈베리파이에서 받은 거리 데이터를 소켓 통신으로 EtherCAT 통신에 사용하는 모터 제어코드에 전송." }
  - { type: video, id: "1zGBJkcFLYHccR4ZVzfW-2GSc75dOFZgf" }
  - { type: p, text: "소켓 통신을 통해 C++ --> C 코드로 데이터 전송" }
  - { type: li, level: 1, text: "PD 제어를 구현하기 위해 실제 트레드밀에 올라가 Gain 값을 설정을 해야하지만 사람이 직접 올라가면 위험하기에 테스트를 위해 사람 사진을 부착한 통의 거리를 판단해 실험을 진행함" }
  - { type: video, id: "12pziHgcxN7hy1DBapY6HBf5t25py_kDk" }
  - { type: li, level: 1, text: "EtherCAT 통신 주기와 카메라 데이터 처리 주기 간의 속도 차이가 큼." }
  - { type: li, level: 1, text: "이로 인해 모터 입장에서는 카메라로부터 들어오는 거리 데이터가 불연속적으로, 마치 Step 함수처럼 갑자기 튀는 형태로 인식됨." }
  - { type: li, level: 1, text: "결과적으로 모터가 갑작스럽게 튀는 동작(jump response)이 발생할 수 있는 문제가 있음." }
  - { type: li, level: 1, text: "이를 완화하기 위해 거리 데이터에 Low Pass Filter를 적용하여 입력을 부드럽게 처리함." }
  - { type: li, level: 1, text: "또한, PD 제어를 위해서는 오차(Error)의 시간에 따른 변화율(미분값)이 필요한데, 직접 미분 시 노이즈가 증폭되기 쉬워 Filtered-Derivative 기법을 사용하여 안정적으로 도출함." }
