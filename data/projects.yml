- id: ankle-energywheel
  detail: true
  category: research
  group: IIRLab
  featured: true
  title: 에너지휠 기반 발목 보조로봇 개발
  period: 2024.02 – 2025.03
  role: 설계, 실험 시스템 구축
  summary: 모터의 회전 관성으로 에너지를 저장했다가 브레이크로 순간 제동해, 발목 push-off를 보조하는 장치를 설계했습니다.
  points:
    - 착용부 압박 없이 관성력으로 보조하는 반작용 휠 방식 제안 (목표 8 Nm, 80 kg 성인 발목 토크의 10%)
    - 라쳇 구조 제동으로 0.02–0.03초 안에 휠 정지 확인 (push-off 구간 0.1초 이내)
    - 비선형 최적화(lsqcurvefit)로 구동 모듈 모델 파라미터 추정
  tools: [SolidWorks, Fusion 360, CATIA, Arduino, MATLAB]
  image: images/projects/ankle-energywheel.jpg
  video: 1Yp-A46g1lWsOoPUpVf-87Fd47UYNAlmi
  links:
    - { label: 논문 (ICROS 2025), url: "https://doi.org/10.5302/J.ICROS.2025.25.0131" }

