- id: treadmill
  detail: true
  category: research
  group: IIRLab
  featured: true
  title: RGBD 카메라를 이용한 트레드밀 자동 제어
  period: 2024.02 – 2024.03
  role: 사람 depth 추출, 모듈 간 통신, PD 제어기
  summary: 사용자의 위치를 실시간으로 인식해 속도를 자동으로 맞춰주는 트레드밀을 만들어, 보조로봇 실험의 기반 장치로 활용했습니다.
  points:
    - Realsense D435 + MediaPipe로 사람 포즈와 거리 측정
    - Jetson Xavier NX → Raspberry Pi(gRPC) → EtherCAT 제어 보드(소켓)로 데이터 전달
    - Low-pass filter와 filtered derivative를 적용한 PD 제어, CST 모드 토크 제어
  tools: [Python, C/C++, CATIA, Jetson, EtherCAT]
  image: images/projects/treadmill.jpg
  video: 13AEfQ49ckDqtM2zhUc8N7kylhG9BR53P
  links:
    - { label: GitHub, url: "https://github.com/minjae030321/Human-Depth-Detect-Realsense" }

